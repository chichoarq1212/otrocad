/* Ajustes de navegación y área de dibujo para pantallas táctiles */
#filebar{min-width:0;overflow-x:auto;scrollbar-width:thin}
#filebar button{flex:0 0 auto}
#groups{min-width:0}
.toolgroup{flex:0 0 auto}
#commandbar{min-width:0}
#cmd{min-width:0;flex:1}
@media(max-width:760px){
 header{min-width:0;overflow:hidden;gap:6px}
 #brand{flex:0 0 auto}
 #filebar{display:flex;flex:1;min-width:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none;overscroll-behavior-x:contain}
 #filebar::-webkit-scrollbar,#tabs::-webkit-scrollbar,#groups::-webkit-scrollbar,#statusbar::-webkit-scrollbar{display:none}
 #tabs{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;overscroll-behavior-x:contain}
 #tabs button{flex:0 0 auto}
 #groups{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:none}
 .toolgroup{width:max-content;min-width:max-content}
 #commandbar{display:flex;gap:6px;min-width:0}
 #cmd{flex:1;min-width:0;width:0}
 #prompt{display:none}
 #statusbar{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;overscroll-behavior-x:contain}
 #statusbar button{flex:0 0 auto;min-width:auto;padding:5px 7px;font-size:10px}
 #status{flex:1;min-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #crossinfo{max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #dynamic{max-width:calc(100% - 16px);gap:4px}
 #dynamic label{font-size:10px}
 #dynamic input{width:65px}
 #properties.open{max-height:112px;overflow:auto}
}
@media(max-width:760px) and (orientation:landscape){
 #ribbon{height:92px}
 #tabs{height:30px}
 #groups{height:60px}
 #workspace{height:calc(100dvh - 44px - 92px - 62px)}
}

/* ESQUECHAT-inspired light CAD chrome; drawing model-space stays dark for legibility */
:root{--bg:#eaf1ff;--panel:#f7faff;--panel2:#e7efff;--line:#c8d8f2;--text:#173665;--muted:#597197;--blue:#185BE8;--yellow:#FFCF23;--canvas:#101820}

/* Keep ribbon panels mutually exclusive even when flex styles are applied. */
#groups > [data-panel][hidden]{display:none!important}
#groups > [data-panel]:not([hidden]){display:flex}
#tabs button[aria-selected="true"]{background:#185BE8;color:#fff;border-color:#185BE8;font-weight:800}
