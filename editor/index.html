<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2e"><title>OtroCAD · Editor</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#101b2e;color:white}header{height:55px;display:flex;align-items:center;gap:7px;overflow:auto;padding:7px}button,select{background:#22334e;color:white;border:1px solid #52627c;border-radius:5px;padding:9px;white-space:nowrap}button.active{background:#f3c83e;color:#101b2e}#brand{font-size:20px;font-weight:900;white-space:nowrap}#brand b{color:#f3c83e}main{height:calc(100dvh - 87px);display:flex}aside{width:150px;background:#17243a;padding:8px;overflow:auto;flex:none}aside button{display:block;width:100%;margin:0 0 7px;text-align:left}aside select{width:100%;margin-bottom:9px}#stage{flex:1;position:relative;min-width:0;background:#f8fafc;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}footer{height:32px;padding:7px 12px;color:#c9d4e4}#help{position:absolute;top:8px;left:8px;color:#34455f;background:white;padding:7px;border-radius:4px;pointer-events:none}@media(max-width:700px){main{flex-direction:column}aside{width:100%;height:82px;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden}aside button{width:auto;min-width:85px;margin:0;text-align:center}aside select{min-width:90px}#help{font-size:11px}}</style></head><body><header><span id="brand">otro<b>CAD</b></span><button onclick="location.href='../'">Inicio</button><button id="undo">↶</button><button id="redo">↷</button><button id="save">Guardar</button><button id="open">Abrir</button><button id="export">SVG</button><button id="project">Proyecto</button><button id="erase">Borrar</button></header><main><aside id="tools"><button data-tool="select">Seleccionar</button><button data-tool="pan">Mover vista</button><button data-tool="line">Línea</button><button data-tool="poly">Polilínea</button><button data-tool="rect">Rectángulo</button><button data-tool="circle">Círculo</button><button data-tool="dim">Cota</button><button data-tool="hatch">Hatch</button><select id="layer"><option value="General">General</option><option value="Muros">Muros</option><option value="Cotas">Cotas</option><option value="Detalles">Detalles</option></select><button id="plus">Zoom +</button><button id="minus">Zoom −</button></aside><div id="stage"><canvas id="cad"></canvas><span id="help">Toca y arrastra para dibujar</span></div></main><footer id="status">OtroCAD alfa · dibujo experimental</footer><input id="file" type="file" accept=".json" hidden><script src="editor.js"></script></body></html>
