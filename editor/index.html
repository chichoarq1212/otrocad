(()=>{
 const media=window.matchMedia('(orientation: landscape) and (max-height: 500px) and (max-width: 950px) and (pointer: coarse)');
 const button=document.getElementById('ribbonToggle');
 const groups=document.getElementById('groups');
 const bottomToggle=document.getElementById('mobileBottomToggle');
 function setBottomOpen(value){
  const open=media.matches && !!value;
  document.body.classList.toggle('cad-mobile-bottom-open',open);
  bottomToggle.setAttribute('aria-expanded',String(open));
  bottomToggle.setAttribute('aria-label',open?'Ocultar comandos y opciones de dibujo':'Mostrar comandos y opciones de dibujo');
  bottomToggle.textContent=open?'✕ Cerrar':'☰ Opciones';
 }
 bottomToggle.addEventListener('click',()=>setBottomOpen(!document.body.classList.contains('cad-mobile-bottom-open')));
 document.getElementById('stage').addEventListener('pointerdown',event=>{
  if(!event.target.closest('#layoutBar'))setBottomOpen(false);
 });
 document.addEventListener('keydown',event=>{if(event.key==='Escape')setBottomOpen(false)});
 function setCollapsed(value){
  const collapsed=media.matches && value;
  document.body.classList.toggle('cad-ribbon-collapsed',collapsed);
  button.setAttribute('aria-expanded',String(!collapsed));
  button.textContent=collapsed?'☰ Herramientas':'⌃ Ocultar';
  button.setAttribute('aria-label',collapsed?'Mostrar herramientas CAD':'Ocultar herramientas CAD');
 }
 button.addEventListener('click',()=>setCollapsed(!document.body.classList.contains('cad-ribbon-collapsed')));
 groups.addEventListener('click',event=>{if(media.matches && event.target.closest('button')) setCollapsed(true)});
 function onModeChange(){setCollapsed(media.matches);setBottomOpen(false)}
 if(media.addEventListener) media.addEventListener('change',onModeChange); else media.addListener(onModeChange);
 onModeChange();
})();
</script><script>if("serviceWorker" in navigator){let hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadController){const el=document.getElementById("offlineState");if(el)el.textContent="Actualización disponible · guarda tu dibujo y recarga"}hadController=true});navigator.serviceWorker.register("../sw.js",{updateViaCache:"none"}).then(async r=>{await navigator.serviceWorker.ready;const el=document.getElementById("offlineState");if(el&&!el.textContent.includes("Actualización"))el.textContent="Recursos sin conexión preparados"}).catch(()=>{const el=document.getElementById("offlineState");if(el)el.textContent="Modo sin conexión no disponible"})}</script></body></html>
