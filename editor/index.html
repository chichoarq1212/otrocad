<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2e"><link rel="manifest" href="../manifest.webmanifest"><title>OtroCAD · Editor técnico</title>
<style>
:root{--bg:#111923;--panel:#1b2735;--panel2:#243448;--line:#35475b;--text:#e8eef5;--muted:#9fb0c3;--blue:#62b8e8;--yellow:#f3c83e;--canvas:#101820}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:13px Inter,system-ui,Arial;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:4px;padding:7px 10px;cursor:pointer;white-space:nowrap}button:hover{border-color:var(--blue)}.toolgroup select,.toolgroup input[type=color]{align-self:center;height:34px;border:1px solid var(--line);border-radius:4px;background:#0e1824;color:var(--text);padding:4px}.toolgroup input[type=color]{width:42px;padding:2px}button.active{background:var(--yellow);color:#172331;border-color:var(--yellow);font-weight:700}header{height:48px;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#0c141e;border-bottom:1px solid var(--line)}#brand{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:900;letter-spacing:-.8px;margin-right:8px;white-space:nowrap}#brand .mark{width:27px;height:27px;display:block;flex:none}#brand .word{display:inline-flex;align-items:baseline;gap:0}#brand .o{color:var(--yellow)}#brand .cad{color:#fff}#brand .o{color:var(--yellow)}#brand .cad{color:#fff}#filebar{display:flex;gap:5px;align-items:center;flex:1;overflow:auto}#ribbon{height:105px;background:#192535;border-bottom:1px solid var(--line);display:flex;flex-direction:column}#tabs{height:30px;display:flex;gap:2px;padding:3px 8px;border-bottom:1px solid #2d3b4c}#tabs button{background:transparent;border:0;border-radius:3px;padding:4px 12px;color:#b9c9d8}#tabs button.active{background:#30465c;color:#fff}#groups{height:75px;display:flex;gap:8px;padding:6px 9px;overflow-x:auto}.toolgroup{display:flex;gap:4px;align-items:stretch;padding-right:9px;border-right:1px solid #35475b}.toolgroup button{min-width:58px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:5px 7px;font-size:11px}.toolgroup button .ico{font-size:19px;color:var(--blue);line-height:1}#workspace{height:calc(100dvh - 48px - 105px - 58px);display:flex;min-height:150px}#stage{position:relative;flex:1;min-width:0;background:var(--canvas);touch-action:none;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#dynamic{position:absolute;top:10px;right:12px;display:none;gap:6px;align-items:center;padding:8px;background:#1b2a3aee;border:1px solid #49617a;border-radius:6px;box-shadow:0 4px 18px #0008}#dynamic label{color:#b6c8d9;font-size:11px}#dynamic input{width:82px;background:#0e1722;border:1px solid #536a80;color:#fff;border-radius:3px;padding:6px}#crossinfo{position:absolute;left:10px;top:10px;padding:5px 8px;border-radius:3px;background:#182638dd;color:#c7d8e8;pointer-events:none}#properties{width:230px;background:#172333;border-left:1px solid var(--line);padding:10px;overflow:auto;display:none}#properties.open{display:block}#properties h3{margin:2px 0 12px;font-size:13px;color:var(--blue)}#properties label{display:block;color:var(--muted);font-size:11px;margin:8px 0 3px}#properties input,#properties select{width:100%;padding:7px;background:#0f1925;color:#fff;border:1px solid var(--line);border-radius:3px}#commandbar{height:31px;background:#0b141f;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:3px 10px}#commandbar strong{color:var(--yellow)}#cmd{flex:1;min-width:0;background:#111d2a;color:#fff;border:1px solid #40556b;border-radius:3px;padding:6px 8px;outline:none}#statusbar{height:27px;background:#1b2938;border-top:1px solid #35475b;display:flex;align-items:center;gap:5px;padding:2px 8px;overflow-x:auto}#statusbar button{font-size:11px;padding:4px 9px;background:transparent}#statusbar button.active{background:#f3c83e;color:#172331}#status{margin-left:auto;color:#9fb0c3;white-space:nowrap;font-size:11px}@media(max-width:760px){header{height:44px;padding:4px 7px}#brand{font-size:17px}#filebar button{padding:6px 8px}#ribbon{height:115px}#tabs{height:32px;overflow-x:auto}#groups{height:83px}#workspace{height:calc(100dvh - 44px - 115px - 66px);flex-direction:column}#stage{min-height:0;flex:1}#properties{width:100%;height:112px;border-left:0;border-top:1px solid var(--line);display:none}#properties.open{display:block}#dynamic{top:auto;bottom:9px;right:8px;left:8px;justify-content:center;flex-wrap:wrap}#dynamic input{width:72px}#commandbar{height:34px;padding:3px 6px}#statusbar{height:32px}.toolgroup button{min-width:53px}}
@media print{html,body{height:auto;overflow:visible;background:white!important}header,#ribbon,#commandbar,#statusbar,#properties,#dynamic,#crossinfo{display:none!important}#workspace{height:auto!important;display:block!important}#stage{height:95vh!important;background:white!important}canvas{width:100%!important;height:95vh!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>
<header><span id="brand" aria-label="OtroCAD"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34" fill="none" stroke="#62b8e8" stroke-width="10" stroke-dasharray="154 60" stroke-linecap="round" transform="rotate(48 50 50)"/><path d="M50 16A34 34 0 0 1 84 50" fill="none" stroke="#f3c83e" stroke-width="10" stroke-linecap="round"/><path d="M50 31v38M31 50h38" stroke="#fff" stroke-width="3" opacity=".85"/><circle cx="50" cy="50" r="5" fill="#f3c83e"/></svg><span class="word"><span class="o">otro</span><span class="cad">CAD</span></span></span><div id="filebar"><button onclick="location.href='../index.html'">Inicio</button><button id="undo">↶ Deshacer</button><button id="redo">↷ Rehacer</button><button id="save">Guardar</button><button id="open">Abrir</button><button id="project">Proyecto</button><button id="export">SVG</button><button id="dxf">DXF</button><button id="pdf">PDF</button><button id="erase">Eliminar</button><button id="propertiesBtn">Propiedades</button></div></header>
<section id="ribbon"><nav id="tabs"><button class="active" data-tab="draw">DIBUJO</button><button data-tab="modify">MODIFICAR</button><button data-tab="annotate">ANOTAR</button><button data-tab="layers">CAPAS</button><button data-tab="view">VISTA</button><button data-tab="settings">CONFIGURACIÓN</button></nav><div id="groups">
<div class="toolgroup" data-panel="draw"><button data-tool="select"><span class="ico">⌖</span>Seleccionar</button><button id="multiSelectToggle" aria-pressed="false">MULTI: OFF</button><button data-tool="line"><span class="ico">／</span>Línea</button><button data-tool="poly"><span class="ico">⌁</span>Polilínea</button><button id="finish-poly"><span class="ico">✓</span>Terminar PL</button><button data-tool="rect"><span class="ico">▱</span>Rectángulo</button><button data-tool="circle"><span class="ico">◯</span>Círculo</button><button data-tool="arc"><span class="ico">⌒</span>Arco</button><button data-tool="ellipse"><span class="ico">⬭</span>Elipse</button><button data-tool="polygon"><span class="ico">⬡</span>Polígono</button></div>
<div class="toolgroup" data-panel="modify" hidden><button data-tool="move"><span class="ico">✥</span>Mover</button><button data-tool="copy"><span class="ico">▢</span>Copiar</button><button data-tool="offset"><span class="ico">∥</span>Offset</button><button data-tool="rotate"><span class="ico">⟳</span>Rotar</button><button data-tool="mirror"><span class="ico">◫</span>Simetría</button><button data-tool="scale"><span class="ico">↗</span>Escalar</button><button data-tool="trim"><span class="ico">✂</span>Recortar</button><button data-tool="extend"><span class="ico">↔</span>Alargar</button><button data-tool="fillet"><span class="ico">⌜</span>Empalme</button><button data-tool="explode"><span class="ico">✣</span>Explotar</button></div>
<div class="toolgroup" data-panel="annotate" hidden><button data-tool="dim"><span class="ico">↔</span>Cota lineal</button><button data-tool="text"><span class="ico">T</span>Texto</button><button data-tool="hatch"><span class="ico">▨</span>Hatch</button><button data-tool="leader"><span class="ico">↗</span>Directriz</button></div>
<div class="toolgroup" data-panel="layers" hidden><label style="align-self:center;color:#a9bfd2">CAPA</label><select id="layer"><option>General</option><option>Muros</option><option>Cotas</option><option>Detalles</option><option>Topografía</option><option>Vialidad</option></select><button id="newLayer">+ Capa</button><button id="layerColor">Color capa</button><button id="layerVisibility">Ocultar capa</button><button id="layerLock">Bloquear capa</button><label style="align-self:center;color:#a9bfd2">COLOR</label><input id="drawColor" type="color" value="#dce8f5"><label style="align-self:center;color:#a9bfd2">GROSOR</label><select id="lineweight"><option value="0.13">0.13 mm</option><option value="0.18">0.18 mm</option><option value="0.25" selected>0.25 mm</option><option value="0.35">0.35 mm</option><option value="0.50">0.50 mm</option><option value="0.70">0.70 mm</option><option value="1.00">1.00 mm</option></select><label style="align-self:center;color:#a9bfd2">TIPO</label><select id="linetype"><option value="CONTINUOUS">Continua</option><option value="DASHED">Discontinua</option></select></div>
<div class="toolgroup" data-panel="view" hidden><button id="zoomIn">＋ Zoom</button><button id="zoomOut">－ Zoom</button><button id="fit">Extensión</button><button data-tool="pan"><span class="ico">✥</span>Encuadre</button></div>
<div class="toolgroup" data-panel="settings" hidden><button id="settingsBtn">Pantalla / HP</button><button id="unitsBtn">Unidades</button><button id="snapBtn">Referencias</button></div>
</div></section>
<main id="workspace"><div id="stage"><canvas id="cad"></canvas><div id="crossinfo">X 0.000 · Y 0.000 · Z 0.000</div><div id="dynamic"><label>LONGITUD</label><input id="dynLen" inputmode="decimal" placeholder="0.00"><label>ÁNGULO</label><input id="dynAngle" inputmode="decimal" placeholder="0°"><button id="acceptPoint">✓</button></div></div><aside id="properties"><h3>PROPIEDADES DEL OBJETO</h3><div id="propContent">Selecciona una entidad para editar sus propiedades.</div></aside></main>
<div id="commandbar"><strong>CMD</strong><input id="cmd" placeholder="Escribe un comando (LINE, PLINE, OFFSET, MOVE...) y pulsa Enter"><span id="prompt">Comando listo</span></div>
<footer id="statusbar"><button id="gridToggle">GRID F7</button><button id="orthoToggle">ORTHO F8</button><button id="snapToggle">SNAP F9</button><button id="polarToggle">POLAR F10</button><button id="osnapToggle">OSNAP F3</button><button id="crossToggle">CRUZ</button><span id="status">OtroCAD · Motor geométrico alfa</span></footer><input id="file" type="file" accept=".json,.dxf,.dwg" hidden><script src="editor.js"></script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{});</script></body></html>
