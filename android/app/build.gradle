plugins { id 'com.android.application' }

def nativeOnly = providers.gradleProperty('otrocadNative').orElse('false').get().toBoolean()

android {
    namespace 'com.otrocad.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.otrocad.app'
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName '0.5.9-test-alpha'
    }
    if (nativeOnly) {
        defaultConfig {
            applicationIdSuffix '.nativealpha'
            versionNameSuffix '-nativo-experimental'
        }
        sourceSets {
            main {
                manifest.srcFile 'src/native/AndroidManifest.xml'
                java.exclude '**/HybridActivity.java'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
