name: Check El Arqui automatic AI live endpoint

on:
  push:
    branches: [main]
    paths:
      - 'workers/arqui-auto.js'
      - 'wrangler.jsonc'
      - '.github/workflows/arqui-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public safe status (must not consume model credits)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://otrocad.cristhian-torres-arq.workers.dev/api/arqui/status"
          code=$(curl --silent --show-error --location --max-time 20 -w '%{http_code}' -o /tmp/arqui-status "$URL" || true)
          echo "HTTP: $code"
          echo "Body: $(head -c 300 /tmp/arqui-status || true)"
          if [ "$code" != "200" ]; then
            echo "::error::Automatic AI backend is not deployed on Cloudflare yet; see docs/ARQUI_IA_AUTOMATICA.md."
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/arqui-status',encoding='utf-8') as file:
              data=json.load(file)
          assert isinstance(data.get('online'),bool),data
          assert data.get('limit')==2,data
          assert isinstance(data.get('globalRemaining'),int),data
          if not data['online']:
              print('Backend installed; owner must enable ARQUI_AUTO_ENABLED=yes on Workers Free.')
          else:
              print('Automatic AI backend enabled; current per-connection remaining:',data['remaining'])
          PY
          echo "Checking simplified client UI is deployed"
          curl --fail --silent --show-error --location --max-time 20 \
            https://otrocad.cristhian-torres-arq.workers.dev/editor/arqui-assistant.js \
            -o /tmp/arqui-assistant-live.js
          grep -Fq 'id="arquiCloudStatus"' /tmp/arqui-assistant-live.js
          grep -Fq 'id="arquiAiSettings" class="arqui-details" hidden' /tmp/arqui-assistant-live.js
          echo "Live OtroCAD has automatic quota UI and hidden provider setup."
