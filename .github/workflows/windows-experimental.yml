name: Windows offline experimental
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'editor/**'
      - 'tests/arqui-static-architecture.test.cjs'
      - 'scripts/build-pages.cjs'
      - '.github/workflows/windows-experimental.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'editor/**'
      - 'tests/arqui-static-architecture.test.cjs'
      - 'scripts/build-pages.cjs'
      - '.github/workflows/windows-experimental.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-install:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar editor y dependencias
        shell: pwsh
        run: |
          node scripts/build-pages.cjs
          node tests/arqui-static-architecture.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/create_windows_icon.py icon-512.png desktop/build/otrocad.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse dist desktop/dist
          Push-Location desktop
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Crear instalador
        working-directory: desktop
        run: npm run dist
      - name: Instalar y abrir sin red
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/release/*-Setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'No se creó el instalador' }
          $target = Join-Path $env:RUNNER_TEMP 'OtroCAD-test'
          $setup = Start-Process $installer.FullName -ArgumentList '/S', "/D=$target" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Instalador terminó con $($setup.ExitCode)" }
          $exe = Join-Path $target 'OtroCAD.exe'
          if (-not (Test-Path $exe)) { throw 'No se encontró la aplicación instalada' }
          Add-Type -AssemblyName System.Drawing
          $appIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if (-not $appIcon) { throw 'La aplicación no tiene icono Windows.' }
          $bitmap = $appIcon.ToBitmap()
          $pixel = $bitmap.GetPixel([int]($bitmap.Width / 2), [int]($bitmap.Height / 2))
          Write-Host "Centro del icono OtroCAD: R=$($pixel.R) G=$($pixel.G) B=$($pixel.B)"
          if ($pixel.R -lt 150 -or $pixel.G -lt 95 -or $pixel.B -gt 170) { throw 'El icono del EXE no parece el logo azul, blanco y amarillo oficial.' }
          $bitmap.Dispose()
          $appIcon.Dispose()
          $smoke = Start-Process $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($smoke.ExitCode -ne 0) { throw "Prueba de apertura terminó con $($smoke.ExitCode)" }
          Get-FileHash $installer.FullName -Algorithm SHA256
      - name: Publicar instalador experimental
        if: github.event_name == 'push'
        continue-on-error: true # GitHub token may lack releases:write; keep downloadable workflow artifact.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-experimental-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: OtroCAD Windows 0.6.1 experimental · ${{ github.run_id }}
          prerelease: true
          make_latest: false
          body: |
            Instalador experimental offline sin firma. Incluye CAD, DWG WebAssembly y biblioteca local para diseño residencial con escaleras, circulación, puertas, mobiliario y cotas. Sin IA generativa, cuentas, servicios remotos ni créditos. CI instala y abre sin red. Pendiente validación física.
          files: desktop/release/*-Setup.exe
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('desktop/release/*-Setup.exe') != ''
        with:
          name: OtroCAD-Windows-experimental
          path: desktop/release/*-Setup.exe
          if-no-files-found: error
