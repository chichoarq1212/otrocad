name: Verificar casa real con IA actualizada (una consulta)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arqui-real-after-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-real-inference-after-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Esperar modelo nuevo publicado sin gastar consultas
        shell: bash
        run: |
          set -euo pipefail
          URL="https://otrocad.cristhian-torres-arq.workers.dev/api/arqui/status"
          for i in $(seq 1 24); do
            curl --fail --silent --show-error --max-time 12 "$URL?check=$i" -o /tmp/arqui-current.json || true
            if python3 - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/arqui-current.json'))
          except Exception:
              data={}
          print('Live model:',data.get('model','old build'), 'online:',data.get('online'),
                'remaining:',data.get('remaining'),'global:',data.get('globalRemaining'))
          if data.get('model')!='@cf/meta/llama-3.1-8b-instruct-fast':
              raise SystemExit(1)
          if not data.get('online') or int(data.get('remaining',0))<1 or int(data.get('globalRemaining',0))<1:
              raise SystemExit('No free quota left for this test visitor')
          PY
            then
              echo "Current supported fast model is live. Proceeding with one guarded inference."
              exit 0
            fi
            if [ "$i" -lt 24 ]; then sleep 8; fi
          done
          echo "::error::Current supported model was not published within the safe preflight window. No inference was consumed."
          exit 1
      - name: Instalar navegador de prueba
        run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Enviar un solo pedido real y comprobar CAD editable
        run: node tests/arqui-real-inference-once.cjs
      - name: Guardar imágenes y resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arqui-real-fixed-result
          path: /tmp/otrocad-real-ia/
          if-no-files-found: ignore
