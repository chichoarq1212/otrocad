name: Validación experimental de LibreDWG
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths:
      - '.github/workflows/libredwg-roundtrip.yml'
      - 'editor/**'
      - 'tests/generate-demo-dxf.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roundtrip:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'verificar-dwg')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: d9468ae948b8f07a08efa756c19f8916052358c0
          path: upstream-libredwg
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool texinfo
          python3 -m pip install ezdxf==1.4.4
      - name: Compilar LibreDWG con lectura y escritura
        run: |
          cd upstream-libredwg
          sh ./autogen.sh
          CFLAGS='-O1' ./configure --disable-werror --disable-bindings --disable-shared
          make -j2
      - name: Convertir el plano de OtroCAD a DWG auténtico y leerlo
        run: |
          node tests/generate-demo-dxf.cjs /tmp/otrocad-input.dxf
          python3 tests/audit-demo-dxf.py /tmp/otrocad-input.dxf
          # Normalize tables before LibreDWG imports the DXF.
          python3 -c "import ezdxf; d=ezdxf.readfile('/tmp/otrocad-input.dxf'); d.dxfversion='AC1015'; d.saveas('/tmp/otrocad-normalized.dxf')"
          python3 tests/audit-demo-dxf.py /tmp/otrocad-normalized.dxf
          upstream-libredwg/programs/dwgwrite --as r2000 -I DXF -o /tmp/otrocad-demo.dwg /tmp/otrocad-normalized.dxf
          test "$(head -c 6 /tmp/otrocad-demo.dwg)" = AC1015
          upstream-libredwg/programs/dwgread -O DXF -o /tmp/otrocad-return.dxf /tmp/otrocad-demo.dwg
          upstream-libredwg/programs/dwg2dxf -m -o /tmp/otrocad-minimal.dxf /tmp/otrocad-demo.dwg
          full=0
          minimal=0
          python3 tests/audit-demo-dxf.py /tmp/otrocad-return.dxf || full=$?
          python3 tests/audit-demo-dxf.py /tmp/otrocad-minimal.dxf || minimal=$?
          test "$full" -eq 0 && test "$minimal" -eq 0
      - name: Conservar archivos para inspección
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libredwg-prueba-conversion
          path: |
            /tmp/otrocad-input.dxf
            /tmp/otrocad-normalized.dxf
            /tmp/otrocad-demo.dwg
            /tmp/otrocad-return.dxf
            /tmp/otrocad-minimal.dxf
          if-no-files-found: warn
