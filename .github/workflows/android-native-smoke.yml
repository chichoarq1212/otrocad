name: Android nativo experimental
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/android-native-smoke.py'
      - 'tests/NativeArcGeometryTest.java'
      - 'tests/NativePolygonGeometryTest.java'
      - 'tests/NativeTransformTest.java'
      - '.github/workflows/android-native-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/android-native-smoke.py'
      - '.github/workflows/android-native-smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar geometría circular nativa
        run: |
          mkdir -p /tmp/otrocad-geometry-test
          javac -d /tmp/otrocad-geometry-test android/app/src/main/java/com/otrocad/app/ArcGeometry.java android/app/src/main/java/com/otrocad/app/PolygonGeometry.java android/app/src/main/java/com/otrocad/app/NativeTransform.java tests/NativeArcGeometryTest.java tests/NativePolygonGeometryTest.java tests/NativeTransformTest.java
          java -cp /tmp/otrocad-geometry-test NativeArcGeometryTest
          java -cp /tmp/otrocad-geometry-test NativePolygonGeometryTest
          java -cp /tmp/otrocad-geometry-test NativeTransformTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build isolated native debug application
        run: |
          gradle -p android clean assembleDebug -PotrocadNative=true --no-daemon --stacktrace
          cp android/app/build/outputs/apk/debug/app-debug.apk OtroCAD-Nativo-experimental-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging OtroCAD-Nativo-experimental-debug.apk | head -n 8
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions OtroCAD-Nativo-experimental-debug.apk | grep -q 'android.permission.INTERNET'; then
            echo '::error::La versión nativa experimental no debe solicitar Internet.'
            exit 1
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch native activity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r OtroCAD-Nativo-experimental-debug.apk
            adb shell am start -W -n com.otrocad.app.nativealpha/com.otrocad.app.MainActivity
            adb shell pidof com.otrocad.app.nativealpha
            python3 tests/android-native-smoke.py
            adb exec-out screencap -p > OtroCAD-nativo-emulador.png
      - name: Publish isolated native test APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-nativo-experimental-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: OtroCAD Android nativo experimental · ${{ github.run_id }}
          prerelease: true
          make_latest: false
          body: |
            APK debug experimental con motor Canvas nativo, instalado y probado en emulador sin permiso de Internet.
            Aún no tiene paridad con la web; DXF es experimental y no escribe DWG.
            Identificador separado para no sustituir la aplicación híbrida. Puede requerir desinstalar una versión debug previa si la firma cambia.
          files: OtroCAD-Nativo-experimental-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OtroCAD-nativo-experimental
          path: |
            OtroCAD-Nativo-experimental-debug.apk
            OtroCAD-nativo-emulador.png
          if-no-files-found: error
