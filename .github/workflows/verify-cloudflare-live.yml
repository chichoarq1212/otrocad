name: Verify Cloudflare live OtroCAD
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'editor/**'
      - 'descargas/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'scripts/**'
      - '.github/workflows/verify-cloudflare-live.yml'
  pull_request:
    paths: ['.github/workflows/verify-cloudflare-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site before deployment
        run: |
          node scripts/build-pages.cjs
          node scripts/verify-pages.cjs
          grep -q '0.5.4' dist/descargas/index.html
      - name: Verify deployed files match this exact build and the APK downloads
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://otrocad.cristhian-torres-arq.workers.dev"
          matched=0
          for i in $(seq 1 18); do
            echo "Checking public build and assets (attempt $i)"
            matched=1
            for file in build-info.json index.html editor/index.html editor/editor.js editor/demo/vivienda.js editor/library/furnishings.js sw.js descargas/index.html; do
              if ! curl --fail --location --silent --show-error --max-time 20 \
                -H 'Cache-Control: no-cache, no-store' \
                "$BASE/$file?verify=${GITHUB_SHA}-$i" -o /tmp/otrocad-live-file || ! cmp -s "dist/$file" /tmp/otrocad-live-file; then
                echo "Not yet current: $file"
                matched=0
                break
              fi
            done
            if [ "$matched" = 1 ]; then break; fi
            if [ "$i" -lt 18 ]; then sleep 20; fi
          done
          if [ "$matched" != 1 ]; then
            echo "::error::Cloudflare does not yet serve all assets from this build."
            exit 1
          fi
          for file in editor/vendor/dwg/otrocad_dwg.js editor/vendor/dwg/otrocad_dwg_bg.wasm; do
            if [ ! -s "dist/$file" ]; then
              echo "::error::Falta el runtime DWG obligatorio en el build: $file"
              exit 1
            fi
            if ! curl --fail --location --silent --show-error --max-time 30 -H 'Cache-Control: no-cache, no-store' "$BASE/$file?verify=${GITHUB_SHA}-wasm" -o /tmp/otrocad-live-wasm || ! cmp -s "dist/$file" /tmp/otrocad-live-wasm; then
              echo "::error::Cloudflare no sirve el runtime DWG exacto: $file"
              exit 1
            fi
          done
          APK="https://github.com/chichoarq1212/otrocad/releases/download/android-hybrid-test-41528654796-1/OtroCAD-Android-0.5.4-test.apk"
          curl --fail --location --silent --show-error --max-time 90 "$APK" -o /tmp/otrocad-download.apk
          unzip -tq /tmp/otrocad-download.apk
          echo "Public build matches this commit and the linked test APK is a readable archive. Device functionality requires separate validation."
