name: Verify Cloudflare live OtroCAD
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'editor/**'
      - 'descargas/**'
      - 'ios/**'
      - 'apple-touch-icon.png'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'scripts/**'
      - '.github/workflows/verify-cloudflare-live.yml'
  pull_request:
    paths: ['.github/workflows/verify-cloudflare-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site before deployment
        run: |
          node scripts/build-pages.cjs
          node scripts/verify-pages.cjs
          grep -q '0.6.1' dist/descargas/index.html
      - name: Verify deployed files match this exact build and the APK downloads
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://otrocad.cristhian-torres-arq.workers.dev"
          # build-info.json contains the deployment commit hash. A site ahead of
          # this run is still valid; compare actual app assets instead.
          curl --fail --location --silent --show-error --max-time 20 "$BASE/build-info.json" -o /tmp/otrocad-live-build-info.json
          matched=0
          for i in $(seq 1 18); do
            echo "Checking public build and assets (attempt $i)"
            matched=1
            for file in index.html editor/index.html editor/editor.js editor/civil3d.js editor/jaimito-assistant.js editor/jaimito-assistant.css editor/arqui-planner.js editor/arqui-knowledge.js editor/arqui-house-layout.js editor/arqui-references.js editor/arqui-assistant.js editor/arqui-assistant.css editor/assets/el-arqui.webp editor/compact-chrome.css editor/geolocation.js editor/mep.js editor/vendor/proj4/proj4.js editor/assets/ing-jaimito-hd.webp editor/demo/vivienda.js editor/library/furnishings.js sw.js descargas/index.html ios/index.html apple-touch-icon.png icon-192.png icon-512.png; do
              if ! curl --fail --location --silent --show-error --max-time 20 \
                -H 'Cache-Control: no-cache, no-store' \
                "$BASE/$file?verify=${GITHUB_SHA}-$i" -o /tmp/otrocad-live-file || ! cmp -s "dist/$file" /tmp/otrocad-live-file; then
                echo "Not yet current: $file"
                matched=0
                break
              fi
            done
            if [ "$matched" = 1 ]; then break; fi
            if [ "$i" -lt 18 ]; then sleep 20; fi
          done
          if [ "$matched" != 1 ]; then
            echo "::error::Cloudflare does not yet serve all assets from this build."
            exit 1
          fi
          for file in editor/vendor/dwg/otrocad_dwg.js editor/vendor/dwg/otrocad_dwg_bg.wasm; do
            if [ ! -s "dist/$file" ]; then
              echo "::error::Falta el runtime DWG obligatorio en el build: $file"
              exit 1
            fi
            if ! curl --fail --location --silent --show-error --max-time 30 -H 'Cache-Control: no-cache, no-store' "$BASE/$file?verify=${GITHUB_SHA}-wasm" -o /tmp/otrocad-live-wasm || ! cmp -s "dist/$file" /tmp/otrocad-live-wasm; then
              echo "::error::Cloudflare no sirve el runtime DWG exacto: $file"
              exit 1
            fi
          done
          APK="https://github.com/chichoarq1212/otrocad/releases/download/android-0.6.1-test/OtroCAD-Android-0.6.1-alpha.apk"
          WINDOWS_EXE="https://github.com/chichoarq1212/otrocad/releases/download/windows-experimental-41947943166-1/OtroCAD-Windows-0.6.1-experimental-Setup.exe"

          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --max-time 90 "$APK" -o /tmp/otrocad-hybrid.apk && unzip -tq /tmp/otrocad-hybrid.apk; then
              echo "APK Android 0.6.1 descargado e íntegro."
              break
            fi
            if [ "$attempt" = 24 ]; then echo "::error::APK 0.6.1 no disponible o corrupto"; exit 1; fi
            echo "Esperando publicación APK 0.6.1 ($attempt/24)"
            sleep 15
          done
          curl --fail --location --silent --show-error --max-time 120 "$WINDOWS_EXE" -o /tmp/otrocad-windows.exe
          test -s /tmp/otrocad-windows.exe
          test "$(head -c 2 /tmp/otrocad-windows.exe)" = "MZ"
          grep -Fq "$APK" dist/descargas/index.html
          grep -Fq "$APK" dist/index.html
          ! grep -Fq "android-hybrid-test-" dist/descargas/index.html
          grep -Fq "$WINDOWS_EXE" dist/descargas/index.html
          echo "Cloudflare build matches this commit; single Android APK and Windows installer download successfully and pass archive/signature checks."
