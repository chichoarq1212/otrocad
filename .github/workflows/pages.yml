name: Publish OtroCAD
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-site
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build website
        run: node scripts/build-pages.cjs
      - name: Verify all local navigation and assets
        run: node scripts/verify-pages.cjs
      - name: Screenshot of the REAL CAD editor
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=2200 --window-size=1440,900 --screenshot="$PWD/dist/editor-preview.png" "file://$PWD/dist/editor/index.html"
          test -s dist/editor-preview.png
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - name: Publish files to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
