name: Publish OtroCAD
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'editor/**'
      - 'ios/**'
      - 'apple-touch-icon.png'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'descargas/**'
      - 'herramientas/**'
      - 'tutorial/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-site
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build website
        run: node scripts/build-pages.cjs
      - name: Verify all local navigation and assets
        run: node scripts/verify-pages.cjs
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - name: Publish files to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
