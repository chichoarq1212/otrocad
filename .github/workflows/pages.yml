name: Publish OtroCAD
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-site
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build website
        run: node scripts/build-pages.cjs
      - name: Verify all local navigation and assets
        run: node scripts/verify-pages.cjs
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - name: Publish files to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
