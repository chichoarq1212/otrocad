name: Probar El Arqui IA real una sola vez

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arqui-real-inference-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-single-real-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador para prueba real
        run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Probar petición real a la IA y generar plano CAD
        run: node tests/arqui-real-inference-once.cjs
      - name: Guardar captura y resultado de la prueba (no repetir consultas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arqui-real-ia-once
          path: /tmp/otrocad-real-ia/
          if-no-files-found: warn
