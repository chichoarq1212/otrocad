name: Compilar OtroCAD Android híbrido online/offline
on:
  push:
    branches: ["main", "otrocad-android-alpha-*"]
    paths:
      - "android/**"
      - ".github/workflows/android-alpha.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-alpha.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: otrocad-android-hybrid-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Incluir editor web local para uso sin conexión
        run: |
          mkdir -p android/app/src/main/assets/editor
          cp editor/index.html editor/editor.js android/app/src/main/assets/editor/
          cp -R editor/demo android/app/src/main/assets/editor/
      - name: Compilar APK híbrido con editor offline
        run: gradle -p android assembleDebug --no-daemon
      - name: Preparar APK con nombre de versión
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OtroCAD-Android-hibrido-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OtroCAD-Android-hibrido-debug
          path: OtroCAD-Android-hibrido-debug.apk
          if-no-files-found: error
      # Esta tarea solo genera un artefacto de pruebas; no modifica releases anteriores.
