name: Compilar OtroCAD Android nativo sin conexión
on:
  push:
    branches: ["main", "otrocad-android-alpha-*"]
    paths:
      - "android/**"
      - ".github/workflows/android-alpha.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-alpha.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: otrocad-android-native-v044-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK nativo
        run: gradle -p android assembleDebug --no-daemon
      - name: Preparar APK con nombre de versión
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OtroCAD-Android-0.4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OtroCAD-Android-Nativo-Offline-0.4.4
          path: OtroCAD-Android-0.4.4.apk
          if-no-files-found: error
      - name: Publicar APK nativo de pruebas
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-native-0.4.4
          target_commitish: ${{ github.sha }}
          name: OtroCAD Android Nativo Offline 0.4.4
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: OtroCAD-Android-0.4.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
