name: Android APK build and verification
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'editor/**'
      - '.github/workflows/android-build-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'editor/**'
      - '.github/workflows/android-build-verify.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK without interactive license setup
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle latest web editor for offline Android mode
        run: |
          mkdir -p android/app/src/main/assets/editor
          # Ship the entire official editor: Civil, road signage, MEP,
          # HVAC loads, cold-room design, official mascots, DWG tools and CSS.
          cp -a editor/. android/app/src/main/assets/editor/
          node scripts/verify-android-offline.cjs android/app/src/main/assets/editor
          printf '{"version":"0.6.3-test-alpha","source":"%s","mode":"offline-hybrid"}\n' "$GITHUB_SHA" > android/app/src/main/assets/editor/android-bundle-info.json
          test -s android/app/src/main/assets/editor/android-bundle-info.json
      - name: Build Android debug APK
        run: gradle -p android clean assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists and inspect package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 8
          unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk > /tmp/otrocad-apk-entry-list.txt
          for required in             editor/index.html editor/editor.js editor/civil3d.js             editor/civil-points.js editor/civil-topography.js             editor/civil-road.js editor/civil-road-ui.js             editor/civil-ribbon.css editor/civil-road-ui.css             editor/mep.js editor/mep-ribbon.css             editor/mep-thermal.js editor/mep-thermal-ui.js             editor/mep-thermal-ui.css editor/kelvin-assistant.js             editor/jaimito-assistant.js editor/assets/ing-kelvin.webp editor/arqui-planner.js editor/arqui-knowledge.js editor/arqui-house-layout.js editor/arqui-references.js editor/arqui-assistant.js editor/arqui-assistant.css editor/arqui-professional.js editor/cad-file-ui.js editor/cad-file-ui.css editor/assets/el-arqui.webp             editor/assets/ing-jaimito-hd.webp; do
            grep -Fx "assets/$required" /tmp/otrocad-apk-entry-list.txt >/dev/null || {
              echo "::error::APK missing $required"; exit 1;
            }
          done
          echo "Todas las herramientas Civil 3D, señalización y MEP están empaquetadas."
      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.otrocad.app/.HybridActivity
            for attempt in $(seq 1 12); do if adb shell pidof com.otrocad.app >/dev/null 2>&1; then echo "OtroCAD inició en Android (intento $attempt)"; exit 0; fi; echo "Esperando inicio de OtroCAD ($attempt/12)"; sleep 2; done; adb logcat -d -s AndroidRuntime:E ActivityManager:W WebViewFactory:E; exit 1
      - name: Prepare named test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OtroCAD-Android-0.6.3-alpha.apk
      # Always preserve the tested APK even if release permissions are restricted.
      - uses: actions/upload-artifact@v4
        with:
          name: OtroCAD-Android-0.6.3-verified
          path: OtroCAD-Android-0.6.3-alpha.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish Android 0.6.3 in GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-0.6.3-test
          overwrite_files: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          name: OtroCAD Android 0.6.3 alfa · El Arqui IA · simulación local
          prerelease: true
          body: |
            OtroCAD Android 0.6.3-test-alpha (versionCode 28).
            APK híbrido de prueba con editor CAD local sin conexión.
            Incluye RE / REGEN para refrescar la vista y MOVER con guía visual y coordenadas. Vista previa provisional en El Arqui mientras escribes. Cotas nuevas con grip central para desplazar la línea; TRIM rápido o con bordes seleccionados para líneas; hachurados arquitectónicos corregidos.
            Incluye El Arqui, MATCHPROP, guardado DWG/DXF, Civil 3D y MEP.
            Sin IA generativa ni consumo de créditos: nuevo repositorio estático de criterios de vivienda, circulación, ventanas, puertas, mobiliario y escaleras en U con descanso. Distribución completa sigue en desarrollo.
            APK debug experimental: la firma puede diferir de versiones anteriores. Guarda tus planos antes de actualizar.
          files: OtroCAD-Android-0.6.3-alpha.apk
