name: Android APK build and verification
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'editor/**'
      - '.github/workflows/android-build-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'editor/**'
      - '.github/workflows/android-build-verify.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK without interactive license setup
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle latest web editor for offline Android mode
        run: |
          mkdir -p android/app/src/main/assets/editor
          cp editor/index.html editor/editor.js editor/civil3d.js editor/jaimito-assistant.js editor/jaimito-assistant.css editor/compact-chrome.css android/app/src/main/assets/editor/
          cp -R editor/demo editor/library editor/assets android/app/src/main/assets/editor/
          if [ -d editor/vendor ]; then cp -R editor/vendor android/app/src/main/assets/editor/; fi
          test -s android/app/src/main/assets/editor/index.html
          test -s android/app/src/main/assets/editor/editor.js
          test -s android/app/src/main/assets/editor/civil3d.js
          test -s android/app/src/main/assets/editor/assets/ing-jaimito-hd.webp
      - name: Build Android debug APK
        run: gradle -p android clean assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists and inspect package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 8
      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.otrocad.app/.HybridActivity
            for attempt in $(seq 1 12); do if adb shell pidof com.otrocad.app >/dev/null 2>&1; then echo "OtroCAD inició en Android (intento $attempt)"; exit 0; fi; echo "Esperando inicio de OtroCAD ($attempt/12)"; sleep 2; done; adb logcat -d -s AndroidRuntime:E ActivityManager:W WebViewFactory:E; exit 1
      - name: Prepare named test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OtroCAD-Android-0.5.6-test.apk
      - name: Publish test APK in GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-0.5.6-test
          overwrite_files: true
          target_commitish: ${{ github.sha }}
          name: OtroCAD Android 0.5.6 · Civil 3D / DXF · Prueba
          prerelease: true
          body: |
            OtroCAD Android 0.5.6-test-alpha (versionCode 19). Reemplaza 0.5.4 en el sitio oficial. Incluye iconos CIVIL 3D rediseñados como pictogramas CAD y optimización de pantalla horizontal para teléfonos Android: cinta contraída y barra inferior de comandos/estados desplegable, además de la recuperación DXF HATCH/INSERT/elevaciones. Validada por compilación e inicio en emulador Android; aún no validada en un dispositivo físico. Editor empaquetado para uso sin conexión.
            APK debug: la firma puede diferir de versiones anteriores. Respalda tus dibujos antes de instalar.
          files: OtroCAD-Android-0.5.6-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OtroCAD-Android-debug-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

