name: Android APK build and verification
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build-verify.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle -p android clean assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists and inspect package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 8
      - uses: actions/upload-artifact@v4
        with:
          name: OtroCAD-Android-debug-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
