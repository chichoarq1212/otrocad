name: Android APK build and verification
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'editor/**'
      - '.github/workflows/android-build-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'editor/**'
      - '.github/workflows/android-build-verify.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK without interactive license setup
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle latest web editor for offline Android mode
        run: |
          mkdir -p android/app/src/main/assets/editor
          cp editor/index.html editor/editor.js android/app/src/main/assets/editor/
          cp -R editor/demo editor/library android/app/src/main/assets/editor/
          test -s android/app/src/main/assets/editor/index.html
          test -s android/app/src/main/assets/editor/editor.js
      - name: Build Android debug APK
        run: gradle -p android clean assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists and inspect package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 8
      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.otrocad.app/.HybridActivity
            adb shell pidof com.otrocad.app || { adb logcat -d -s AndroidRuntime:E ActivityManager:W WebViewFactory:E; exit 1; }
      - name: Prepare named test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OtroCAD-Android-0.5.4-test.apk
      - name: Publish test APK in GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-hybrid-test-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: OtroCAD Android híbrido · Prueba ${{ github.run_id }}
          prerelease: true
          body: |
            Versión híbrida de pruebas. Instalada y abierta en un emulador Android; aún no validada en dispositivo físico. Incluye editor web empaquetado para uso sin conexión.
            APK debug: la firma puede diferir de versiones anteriores. Respalda tus dibujos antes de instalar.
          files: OtroCAD-Android-0.5.4-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OtroCAD-Android-debug-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

