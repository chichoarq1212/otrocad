name: Android APK build and verification
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'editor/**'
      - '.github/workflows/android-build-verify.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK without interactive license setup
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle latest web editor for offline Android mode
        run: |
          mkdir -p android/app/src/main/assets/editor
          cp editor/index.html editor/editor.js android/app/src/main/assets/editor/
          test -s android/app/src/main/assets/editor/index.html
          test -s android/app/src/main/assets/editor/editor.js
      - name: Build Android debug APK
        run: gradle -p android clean assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists and inspect package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 8
      - name: Prepare named test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OtroCAD-Android-0.5.3-test.apk
      - name: Publish test APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-native-0.5.3-test
          name: OtroCAD Android 0.5.3 · Test build
          prerelease: true
          body: |
            Versión de pruebas. Incluye editor web actualizado empaquetado para uso sin conexión.
            APK debug: la firma puede diferir de versiones anteriores. Respalda tus dibujos antes de instalar.
          files: OtroCAD-Android-0.5.3-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OtroCAD-Android-debug-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
