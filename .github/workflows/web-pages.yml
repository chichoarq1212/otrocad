name: Validar y preparar OtroCAD Web

on:
  push:
    branches: ["main"]
    paths:
      - "editor/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/web-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "editor/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar JavaScript y pruebas de grips
        run: |
          node --check editor/editor.js
          node --check sw.js
          node --check tests/grips.test.cjs
          node tests/grips.test.cjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Generar salida web limpia
        run: |
          node scripts/build-pages.cjs
          test -f dist/index.html
          test -f dist/editor/index.html
          test -f dist/editor/editor.js
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icon.svg
          test ! -e dist/android
          test ! -e dist/.github
          test ! -e dist/tests
