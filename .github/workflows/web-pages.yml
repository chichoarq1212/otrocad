name: Validar y preparar OtroCAD Web

on:
  push:
    branches: ["main"]
    paths:
      - "editor/**"
      - "ios/**"
      - "apple-touch-icon.png"
      - "icon-192.png"
      - "icon-512.png"
      - "descargas/**"
      - "tutorial/**"
      - "herramientas/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "scripts/**"
      - "tests/**"
      - "dwg-wasm/**"
      - "dwg-wasm/**"
      - ".github/workflows/web-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "editor/**"
      - "ios/**"
      - "apple-touch-icon.png"
      - "icon-192.png"
      - "icon-512.png"
      - "descargas/**"
      - "tutorial/**"
      - "herramientas/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "scripts/**"
      - "tests/**"
      - "dwg-wasm/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar JavaScript y pruebas de grips
        run: |
          node --check editor/editor.js
          node --check editor/civil3d.js
          node --check editor/mep.js
          node --check editor/mep-thermal.js
          node --check editor/mep-thermal-ui.js
          node --check tests/mep-thermal.test.cjs
          node tests/mep-thermal.test.cjs
          node tests/mep.test.cjs
          node --check editor/civil-points.js
          node --check editor/civil-topography.js
          node --check editor/civil-road.js
          node --check editor/civil-road-ui.js
          node --check tests/civil-road-ui.test.cjs
          node tests/civil-road-ui.test.cjs
          node --check editor/kelvin-assistant.js
          node --check editor/arqui-planner.js
          node --check editor/arqui-references.js
          node --check editor/arqui-assistant.js
          node --check tests/arqui-planner.test.cjs
          node tests/arqui-planner.test.cjs
          node --check tests/arqui-assistant.test.cjs
          node tests/arqui-assistant.test.cjs
          node --check editor/arqui-professional.js
          node --check editor/cad-file-ui.js
          node --check tests/arqui-professional.test.cjs
          node --check tests/cad-save-matchprop.test.cjs
          node tests/arqui-professional.test.cjs
          node tests/cad-save-matchprop.test.cjs
          node --check tests/arqui-worker.test.cjs
          node tests/arqui-worker.test.cjs
          node tests/arqui-conversation.test.cjs
          node --check tests/kelvin-portrait.test.cjs
          node tests/kelvin-portrait.test.cjs
          node --check tests/civil-topography-road.test.cjs
          node tests/civil-topography-road.test.cjs
          node --check editor/geolocation.js
          node tests/geolocation.test.cjs
          node --check editor/jaimito-assistant.js
          node --check tests/jaimito-assistant.test.cjs
          node tests/jaimito-assistant.test.cjs
          node --check editor/demo/vivienda.js
          node --check sw.js
          node --check tests/civil3d.test.cjs
          node --check tests/dxf-import-regression.test.cjs
          node --check tests/grips.test.cjs
          node tests/civil3d.test.cjs
          node tests/mobile-civil-toolbar.test.cjs
          node tests/dxf-import-regression.test.cjs
          node tests/grips.test.cjs
          node tests/ios-touch.test.cjs
          node tests/cad-precision.test.cjs
          node --check tests/keyboard-dynamic.test.cjs
          node tests/keyboard-dynamic.test.cjs
          node --check tests/unified-layout.test.cjs
          node tests/unified-layout.test.cjs
          node tests/storage-dxf.test.cjs
          node tests/dwg-integration.test.cjs
          node tests/build-version.test.cjs
          node tests/offline-worker.test.cjs
          python scripts/generate-furniture.py
          python scripts/generate-demo.py
          git diff --exit-code -- editor/library/furnishings.js editor/demo/vivienda.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Validar DXF con un lector independiente
        run: |
          python -m pip install --disable-pip-version-check ezdxf==1.4.4
          node tests/generate-demo-dxf.cjs /tmp/otrocad-demo-ci.dxf
          python tests/audit-demo-dxf.py /tmp/otrocad-demo-ci.dxf
      - name: Generar salida web limpia
        run: |
          node scripts/build-pages.cjs
          test -f dist/index.html
          test -f dist/editor/index.html
          test -f dist/editor/editor.js
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icon.svg
          test ! -e dist/android
          test ! -e dist/.github
          test ! -e dist/tests

