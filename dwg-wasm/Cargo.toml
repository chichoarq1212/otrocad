[package]
name = "otrocad-dwg-wasm"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Local DWG/DXF read-write bridge for OtroCAD using acadrust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acadrust = { version = "=0.6.8", default-features = false }
wasm-bindgen = "0.2"
